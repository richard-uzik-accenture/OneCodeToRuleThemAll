name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
  OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm install --global vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v4
        with:
          version: '*'

      - name: Create package
        run: |
          octo pack \
            --id=reflow \
            --version=1.0.${{ github.run_number }} \
            --basePath=.vercel/output \
            --outFolder=./package

      - name: Push package to Octopus
        uses: OctopusDeploy/push-package-action@v4
        with:
          packages: ./package/reflow.1.0.${{ github.run_number }}.zip

      - name: Create Octopus release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: reflow
          package_version: 1.0.${{ github.run_number }}
